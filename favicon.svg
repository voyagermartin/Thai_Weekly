<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景深邃黑藍漸層 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- 邊框科技藍霓虹漸層 -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- 泰文天藍至水藍漸層 -->
    <linearGradient id="thai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="40%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- 聲波能量暖金/科技藍漸層 -->
    <linearGradient id="wave-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <!-- 柔和陰影濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 主體圓角矩形徽章 -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="12" filter="url(#card-shadow)" />

  <!-- 內部微邊光裝飾 (Inner Glass Edge) -->
  <rect x="34" y="34" width="444" height="444" rx="102" ry="102" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />

  <!-- 泰文字母「ไ」(Thai / Voice Learning) -->
  <g filter="url(#glow)">
    <text x="215" y="295"
          font-family="'Noto Sans Thai', 'Sarabun', 'Thonburi', 'Leelawadee UI', 'Segoe UI', system-ui, sans-serif"
          font-size="310"
          font-weight="900"
          text-anchor="middle"
          dominant-baseline="central"
          fill="url(#thai-grad)">ไ</text>
  </g>

  <!-- 右側微型動態聲波條 (Soundwave Audio Bars: 象徵聽力自測與 TTS 原地語音) -->
  <g transform="translate(355, 175)">
    <!-- 聲波 1 -->
    <rect x="0" y="55" width="16" height="70" rx="8" fill="url(#wave-grad)" opacity="0.85" />
    <!-- 聲波 2 (主峰) -->
    <rect x="28" y="20" width="16" height="140" rx="8" fill="url(#wave-grad)" />
    <!-- 聲波 3 -->
    <rect x="56" y="40" width="16" height="100" rx="8" fill="url(#wave-grad)" opacity="0.95" />
    <!-- 聲波 4 -->
    <rect x="84" y="70" width="16" height="40" rx="8" fill="url(#wave-grad)" opacity="0.75" />
  </g>

  <!-- 左上微光亮點 -->
  <circle cx="100" cy="100" r="4" fill="#38bdf8" opacity="0.6" filter="url(#glow)" />
</svg>

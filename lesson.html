      --accent-gold-light: #fde68a; /* 亮香檳金 */

<!-- 即時從 Google Sheet (GViz API) 載入並動態渲染邏輯 -->
<script>
  const SPREADSHEET_ID = "1DvxPjzNRlTRSMSXr6eaktU2dBQZSS9oWadNfT3_ZUTM";

  function parseGViz(text) {
    const raw = JSON.parse(text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1));
    if (!raw.table || !raw.table.cols) return [];

    const colLabels = raw.table.cols.map(c => (c.label ? c.label.trim() : ''));
    const hasLabels = colLabels.some(l => l.length > 0);

    let headers = [];
    let dataRows = [];

    if (hasLabels) {
      headers = colLabels;
      dataRows = raw.table.rows;
    } else {
      headers = raw.table.rows[0].c.map(cell => (cell && cell.v !== null) ? String(cell.v).trim() : '');
      dataRows = raw.table.rows.slice(1);
    }

    return dataRows.map(row => {
      const item = {};
      headers.forEach((h, i) => {
        if (h && row.c && row.c[i] && row.c[i].v !== null) {
          item[h] = row.c[i].v;
        } else if (h) {
          item[h] = '';
        }
      });
      return item;
    });
  }

  async function fetchSheetData(sheetName) {
    const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${sheetName}`;
    const resp = await fetch(url);
    const text = await resp.text();
    return parseGViz(text);
  }

  async function initLesson() {
    try {
      const urlParams = new URLSearchParams(window.location.search);
      let targetIssue = urlParams.get('issue');

      // 平行拉取 4 個分頁資料
      const [issues, vocab, sentences, grammar] = await Promise.all([
        fetchSheetData('Issues'),
        fetchSheetData('Vocab'),
        fetchSheetData('Sentences'),
        fetchSheetData('Grammar')
      ]);

      // 若未指定期數，取最新一期 published
      let currentIssueData = null;
      if (targetIssue) {
        currentIssueData = issues.find(i => i.issue_code === targetIssue);
      }
      if (!currentIssueData) {
        // 尋找已發布的最新期數（倒序）
        const publishedIssues = issues.filter(i => i.status === 'published');
        currentIssueData = publishedIssues[publishedIssues.length - 1] || issues[0];
        targetIssue = currentIssueData.issue_code;
      }

      renderLesson(currentIssueData, vocab, sentences, grammar);
    } catch (err) {
      console.error("載入課程失敗:", err);
      document.getElementById('loading-state').innerHTML = `
        <div style="color:var(--accent-red); font-size:22px; font-weight:800; margin-bottom:12px;">⚠️ 課程資料載入失敗</div>
        <div style="color:var(--text-muted); font-size:15px;">請確認網路連線或稍後再試。錯誤細節: ${err.message}</div>
      `;
    }
  }

  function renderLesson(issue, vocabAll, sentencesAll, grammarAll) {
    const code = issue.issue_code;
    document.title = `泰語學習週報｜${code} ${issue.title}`;
    document.getElementById('tag-vol').innerText = `VOL. ${code} ｜ ${issue.year} 第 ${issue.week} 週`;
    document.getElementById('tag-date').innerText = `${issue.publish_date} SATURDAY`;
    document.getElementById('lesson-title').innerText = issue.title;
    document.getElementById('lesson-subtitle').innerHTML = `
      <span style="display:inline-block">${issue.subtitle_1}</span>
      <span style="display:inline-block">${issue.subtitle_2}</span>
    `;
    document.getElementById('pill-time').innerHTML = `⏱️ <b>閱讀時間</b>：${issue.read_time}`;
    document.getElementById('pill-highlights').innerHTML = `🎯 <b>本期重點</b>：${issue.highlights}`;

    // 1. 渲染單字庫 (Core Vocab)
    const issueVocab = vocabAll.filter(v => v.issue_code === code);
    const coreVocab = issueVocab.filter(v => v.type === 'core');
    const vocabGrid = document.getElementById('vocab-grid');
    vocabGrid.innerHTML = coreVocab.map(v => `
      <div class="vocab-card">
        <div class="vocab-top">
          <div>
            <div class="thai-word">${v.thai}</div>
            <div class="phonetic">${v.phonetic}</div>
          </div>
          <button class="btn-audio" onclick="playTTS('${v.thai}', this)" title="播放泰語標準發音">🔊</button>
        </div>
        <div class="meaning">${v.meaning}</div>
      </div>
    `).join('');

    // 2. 渲染情境句型
    const issueSentences = sentencesAll.filter(s => s.issue_code === code).sort((a,b) => Number(a.order) - Number(b.order));
    const sentenceList = document.getElementById('sentences-list');
    sentenceList.innerHTML = issueSentences.map(s => `
      <div class="sentence-card">
        <div>
          <div class="sentence-thai">${s.thai}</div>
          <div class="sentence-phonetic">${s.phonetic}</div>
          <div class="sentence-meaning">${s.meaning}</div>
        </div>
        <button class="btn-audio" onclick="playTTS('${s.thai}', this)" title="播放例句發音">🔊</button>
      </div>
    `).join('');

    // 3. 渲染語法解析
    const issueGrammar = grammarAll.filter(g => g.issue_code === code).sort((a,b) => Number(a.point_num) - Number(b.point_num));
    const grammarList = document.getElementById('grammar-list');
    grammarList.innerHTML = issueGrammar.map((g, idx) => {
      let examples = [];
      try {
        examples = JSON.parse(g.examples_json);
      } catch (e) {
        examples = [];
      }
      const pillsHtml = examples.map(eg => `
        <div class="example-pill">
          <span class="th">${eg.thai}</span>
          <span style="color:#cbd5e1;">(${eg.phonetic}) ${eg.meaning}</span>
          <button class="btn-audio-mini" onclick="playTTS('${eg.thai}', this)" title="播放發音">🔊</button>
        </div>
      `).join('');

      return `
        <div class="grammar-card">
          <div class="grammar-card-title">💡 語法重點 ${idx + 1}：${g.title}</div>
          <p style="color:#d1d5db; line-height:1.75;">${g.explanation_html}</p>
          <div class="grammar-sub">常用搭配例句：</div>
          <div class="pill-group">
            ${pillsHtml}
          </div>
        </div>
      `;
    }).join('');

    // 4. 渲染文化時事與文化專題發音膠囊 (culture-vocab-sec)
    const cultCard = document.getElementById('culture-card');
    const cultVocab = issueVocab.filter(v => v.type === 'culture');
    const cultPillsHtml = cultVocab.map(cv => `
      <div class="example-pill">
        <span class="th">${cv.thai}</span>
        <span style="color:#cbd5e1;">(${cv.phonetic}) ${cv.meaning}</span>
        <button class="btn-audio-mini" onclick="playTTS('${cv.thai}', this)" title="播放發音">🔊</button>
      </div>
    `).join('');

    // 防呆清理：若後端或 Sheet 資料已包含線控經理實務備忘標題前綴，去除以防畫面重複顯示
    let cleanMemoHtml = (issue.culture_memo_html || '').trim();
    cleanMemoHtml = cleanMemoHtml.replace(/^(<b>)?\s*💡?\s*線控經理實務備忘[（(][^）)]*[）)][:：]?\s*(<\/b>)?\s*(<br\s*\/?>)?/i, '').trim();

    cultCard.innerHTML = `
      <h3>🏛️ ${issue.culture_title}</h3>
      ${issue.culture_body_html}
      <div class="culture-callout">
        <b>💡 線控經理實務備忘（Line Control Tourism Memo）：</b><br>
        ${cleanMemoHtml}
      </div>
      <div class="culture-vocab-sec" style="margin-top: 24px; border-top: 1px solid rgba(245, 158, 11, 0.25); padding-top: 20px;">
        <div style="font-size: 17px; font-weight: 700; color: var(--accent-gold); margin-bottom: 14px; display: flex; align-items: center; gap: 8px;">
          <span>🎧</span> 文化專題精選語彙（點擊按鈕聆聽標準泰語發音）：
        </div>
        <div class="pill-group">
          ${cultPillsHtml || '<span style="color:var(--text-muted); font-size:14px;">本期文化特輯專題單字</span>'}
        </div>
      </div>
    `;

    // 顯示內容並隱藏載入中狀態
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('lesson-content').style.display = 'block';
  }

  // 語音播放系統 (Google TTS + Web Speech API 雙引擎備援)
  let currentAudio = null;
  let playbackRate = 1.0;
  let isMasked = false;

  function toggleRate(rate) {
    playbackRate = rate;
    document.getElementById('btn-rate-1').classList.toggle('active', rate === 1.0);
    document.getElementById('btn-rate-075').classList.toggle('active', rate === 0.75);
    if (currentAudio) currentAudio.playbackRate = rate;
    showToast(`語音速度切換為 ${rate}x`);
  }

  function toggleMask() {
    isMasked = !isMasked;
    const btn = document.getElementById('btn-mask-toggle');
    btn.classList.toggle('active', isMasked);
    btn.innerText = isMasked ? '👁️‍🗨️ 恢復中文顯示' : '👁️ 遮蔽中文自測';

    document.querySelectorAll('.meaning').forEach(el => {
      el.classList.toggle('masked', isMasked);
      if (!isMasked) el.onclick = null;
      else el.onclick = () => el.classList.remove('masked');
    });

    document.querySelectorAll('.sentence-meaning').forEach(el => {
      el.classList.toggle('masked', isMasked);
      if (!isMasked) el.onclick = null;
      else el.onclick = () => el.classList.remove('masked');
    });

    showToast(isMasked ? '已開啟遮蔽測驗（點擊即可翻開）' : '已恢復顯示中文');
  }

  function playTTS(text, btnElement) {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
    document.querySelectorAll('.btn-audio, .btn-audio-mini').forEach(b => b.classList.remove('playing'));

    if (btnElement) {
      btnElement.classList.add('playing');
    }

    showToast(`🔊 正在播放：${text}`);

    const encoded = encodeURIComponent(text);
    const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=th&q=${encoded}`;
    
    const audio = new Audio();
    currentAudio = audio;
    audio.playbackRate = playbackRate;

    const cleanup = () => {
      if (btnElement) btnElement.classList.remove('playing');
      if (currentAudio === audio) currentAudio = null;
    };

    audio.onended = cleanup;

    // 若 Google 語音因任何網路因素異常，自動切換至 Web Speech API 原生泰語發音
    audio.onerror = () => {
      console.warn('Google TTS 載入受阻，自動切換至 Web Speech API 原生語音播放');
      playWebSpeech(text, btnElement);
    };

    audio.src = audioUrl;
    audio.play().catch(e => {
      console.warn('Google TTS 播放異常，切換至 Web Speech API:', e);
      playWebSpeech(text, btnElement);
    });
  }

  function playWebSpeech(text, btnElement) {
    if (!('speechSynthesis' in window)) {
      showToast('⚠️ 瀏覽器不支援語音播放');
      if (btnElement) btnElement.classList.remove('playing');
      return;
    }

    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'th-TH';
    utterance.rate = playbackRate;

    const voices = window.speechSynthesis.getVoices();
    const thaiVoice = voices.find(v => v.lang === 'th-TH' || v.lang.toLowerCase().includes('th'));
    if (thaiVoice) {
      utterance.voice = thaiVoice;
    }

    utterance.onend = () => {
      if (btnElement) btnElement.classList.remove('playing');
    };

    utterance.onerror = (e) => {
      console.error('Web Speech 播放錯誤:', e);
      if (btnElement) btnElement.classList.remove('playing');
      showToast('⚠️ 語音播放受阻，請檢查音效設定');
    };

    window.speechSynthesis.speak(utterance);
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.style.display = 'flex';
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => {
      toast.style.display = 'none';
    }, 2000);
  }

  // 初始化載入
  window.addEventListener('DOMContentLoaded', initLesson);
</script>
</body>
</html>

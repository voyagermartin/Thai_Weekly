name: Auto Sync Thai Weekly from Google Drive

on:
  schedule:
    # 每週六台灣時間 09:15, 09:30, 09:45, 10:00 各觸發一次檢查（UTC 01:15 ~ 02:00）
    - cron: '15,30,45 1 * * 6'
    - cron: '0 2 * * 6'
  workflow_dispatch: # 支援在 GitHub 網頁 Actions 頁籤一鍵手動觸發

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API Client
        run: pip install google-api-python-client google-auth

      - name: Download HTML Files from Google Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY || secrets.GCP_SA_KEY_JSON }}
          FOLDER_ID: '1xTWvfaAEIqzHFpDKtG7ipdMBZf8PYbBA'
        run: |
          python - << 'EOF'
          import os, json, io
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          key_str = os.environ.get('GDRIVE_SA_KEY')
          if not key_str:
              raise ValueError("Secret GDRIVE_SA_KEY (or GCP_SA_KEY_JSON) is not set or empty in GitHub Secrets!")

          key_data = json.loads(key_str)
          creds = service_account.Credentials.from_service_account_info(
              key_data, scopes=['https://www.googleapis.com/auth/drive.readonly']
          )
          service = build('drive', 'v3', credentials=creds)

          folder_id = os.environ['FOLDER_ID']
          query = f"'{folder_id}' in parents and trashed = false and name contains '.html'"
          results = service.files().list(
              q=query,
              fields="files(id, name, modifiedTime)",
              supportsAllDrives=True,
              includeItemsFromAllDrives=True
          ).execute()
          files = results.get('files', [])

          print(f"在 Google Drive 找到 {len(files)} 個 HTML 檔案")
          for f in files:
              name = f['name']
              if name.endswith('.bak'):
                  continue
              print(f"正在同步: {name} ...")
              request = service.files().get_media(fileId=f['id'], supportsAllDrives=True)
              with open(name, 'wb') as fh:
                  downloader = MediaIoBaseDownload(fh, request)
                  done = False
                  while not done:
                      status, done = downloader.next_chunk()
          print("所有檔案同步完成！")
          EOF

      - name: Commit & Push Changes
        run: |
          git config --global user.name "thai-sync-bot"
          git config --global user.email "thai-sync-bot@thai-weekly-sync.iam.gserviceaccount.com"
          git add *.html
          if git diff --staged --quiet; then
            echo "無檔案異動，略過提交。"
          else
            git commit -m "Auto-publish Thai weekly $(date +'%Y-%m-%d') [skip ci]"
            git push origin main
            echo "成功由雲端同步並推播至 GitHub Pages！"
          fi

name: Sync Thai Weekly from Google Drive

on:
  schedule:
    # 台灣時間 (UTC+8) 每週六上午 09:30 = UTC 每週六 01:30
    - cron: '30 1 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Run Google Drive to GitHub Sync Script
        env:
          GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
        run: |
          python sync_drive_to_github.py
